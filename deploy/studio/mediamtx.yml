# Nexus Studio camera server (MediaMTX) on crashmetheus. Rendered by install.sh: __PUBLISH_PASS__ is replaced
# with the secret in ~/.config/nexus-studio/publish.pass, so this template is safe to commit.
logLevel: info

authMethod: internal
authInternalUsers:
  # Cameras and phones publish with this account:
  #   rtmp://crashmetheus.lan/<path>?user=studio&pass=<publish.pass>
  - user: studio
    pass: __PUBLISH_PASS__
    ips: []
    permissions:
      - action: publish
  # Local processes (the webcam's ffmpeg, OBS) need no credentials.
  - user: any
    ips: ["127.0.0.1", "::1"]
    permissions:
      - action: publish
      - action: read
      - action: api
  # Nexus on the Pi: status checks, and viewing through its login-protected /studio/ proxy.
  # Nobody else on the LAN can watch.
  - user: any
    ips: ["__PI_IP__"]
    permissions:
      - action: read
      - action: api

api: true
apiAddress: :9997
metrics: false
pprof: false
playback: false

# Local-only RTSP, for OBS media sources (rtsp://127.0.0.1:8554/<path>).
rtsp: true
rtspAddress: 127.0.0.1:8554
rtspTransports: [tcp]

rtmp: true
rtmpAddress: :1935

hls: false
srt: false
moq: false

webrtc: true
webrtcAddress: :8889
webrtcLocalUDPAddress: :8189
webrtcAllowOrigins: [__PI_ORIGINS__]
# No trusted proxies on purpose: access is granted by the Pi's own IP (its proxy has already checked the
# Nexus login). Trusting X-Forwarded-For would judge the viewer's IP instead, which is not allowed.
# Advertise only the LAN address (not Podman/Tailscale interfaces) to viewers.
webrtcIPsFromInterfaces: false
webrtcAdditionalHosts: ["__STUDIO_IP__"]

paths:
  # USB webcams found by install.sh (one on-demand path each; re-run install.sh after plugging one in).
__WEBCAMS__
  # Anything else that publishes (phones via Larix, DJI Mimo "Live -> RTMP") under any simple name.
  # Nexus discovers these automatically while they are live.
  "~^[a-z0-9][a-z0-9_-]{0,63}(/[a-z0-9][a-z0-9_-]{0,63})?$": {}
